<script>
/*
 * Analyse des tickets pour la carte en direct : mêmes règles que tickets-praxedo/analyse_tickets.py
 * (échéances GTR, priorités, nouveaux, justifiés et relances, interventions où caser un ticket),
 * plus les fins d'intervention reçues par mail. Fonctions pures : analyser(donnees, maintenant).
 */
var REGLAGES = {
  NOUVEAU_H: 24,     // un ticket à planifier reste « nouveau » 24 h
  CASER_M: 1000,     // intervention déjà planifiée à moins de 1 km : programmer dans la foulée
  RELANCE_JO: 10,    // ticket justifié : relance tous les 10 jours ouvrés
  HO_DEBUT: 8, HO_FIN: 18,  // heures ouvrées
  // GTR comptée depuis la création : niveau 1 = 4 h, niveau 2 hors RDV = 1 j ouvré, niveau 3 = 5 j ouvrés, niveau 4 = 10 j ouvrés
  GTR_NIVEAU: { 1: ['heures', 4], 2: ['jours', 1], 3: ['jours', 5], 4: ['jours', 10] }
};

var RE_JUSTIF = new RegExp([
  'GTR\\s+justifi[a-zà-ÿ]*[^\\n.]{0,60}',
  'justifi(?:é|e|ée|ee|cation)(?![a-zà-ÿ])[^\\n.]{0,60}',
  '(?:poteau|pot(?![a-zà-ÿ])\\.?|appui)[^\\n.]{0,25}?(?:^|\\s)(?:à|a)\\s+(?:remplacer|changer|signaler|poser|redresser)(?![a-zà-ÿ])[^\\n.]{0,40}',
  '(?:en\\s+)?attente\\s+(?:d[eu]\\s+|de\\s+la\\s+|d[\'’]\\s*)?(?:orange|enedis|poteau|nacelle|autorisation|arr[êe]t[ée]|mairie|[ée]lagage|mat[ée]riel|accord|syndic|gestionnaire)(?![a-zà-ÿ])[^\\n.]{0,40}',
  'signalisation[^\\n.]{0,20}orange[^\\n.]{0,30}',
  'sig\\s+faite[^\\n.]{0,50}'
].join('|'), 'i');
var RE_COL_NOTES = /note|comment|remarque|observ|justif/i;
// Statuts Praxedo de fin (à ajouter au filtre de l'export) et d'annulation ; colonne de date de fin si l'export en a une
var RE_STATUT_FIN = /termin|r[ée]alis|valid|cl[ôo]tur|ferm/i;
var RE_STATUT_ANNULE = /annul/i;
var RE_COL_FIN = /^(date (de )?)?(fin|r[ée]alisation|cl[ôo]ture)|(r[ée]alis[ée]e?|termin[ée]e?|cl[ôo]tur[ée]e?) le|fin r[ée]elle/i;
var RE_PREVU = /(prévu|prevu|programm|planifi|travaux|remplac|pose|passage)[^\n]{0,30}$/i;
// Repères dans la description, pour relier les tickets entre eux (mêmes motifs que analyse_tickets.py)
var RE_CLS = /\b[A-Z]{2}\d{3}-[A-Z]{5}-\d{3}\b/g;
var RE_PTO = /\b(?:TN-[A-Z0-9]{3,5}-[A-Z0-9]{4,5}|GE-\d{4}-[A-Z0-9]{4})\b/g;
var RE_BOITE = /\b(?:GNY-(?:BPI|BPE)-[A-Z0-9]{4,6}(?:-\d{2})?|(?:PBO|BPE|BPI|PEC|PEO)-\d{2}-\d{3}-\d{3}-[A-Z0-9]{4}(?:-\d)?)\b/gi;
var RE_REF = /(?:BB-)?\b(20\d{6}T\d{4})\b/gi;
var RE_IMMEUBLE = /^(?:GNY-SITE-|IMB-|TN-BAT-)/i;
var RE_INFO_SITE = /Information du client\s*:\s*([A-Z0-9-]+)\s*\/\s*([^\n]*)/i;
var STATUTS_OUVERTS = ['Qualifiée', 'Pré-planifiée', 'Planifiée', 'Synchronisée'];

function dt(s) {
  var m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2}))?/.exec(String(s || '').trim());
  return m ? new Date(+m[3], m[2] - 1, +m[1], +(m[4] || 0), +(m[5] || 0)) : null;
}
function fd(d, heure) {
  if (!d) return '';
  var p = function (n) { return (n < 10 ? '0' : '') + n; };
  return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear() + (heure === false ? '' : ' ' + p(d.getHours()) + ':' + p(d.getMinutes()));
}
function plusJours(d, n) { var x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
function fretard(ms) { var h = Math.floor(ms / 3600e3); return h < 24 ? h + ' h' : Math.floor(h / 24) + ' j'; }
function trouver(texte, re, groupe) {
  var out = [], m; re.lastIndex = 0;
  while ((m = re.exec(texte))) out.push(m[groupe || 0]);
  return out;
}
function uniques(l) { return l.filter(function (x, i) { return l.indexOf(x) === i; }).sort(); }
function norm(s) {
  s = String(s || '').normalize('NFKD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
  s = s.replace(/\b(RUE|R)\b/g, 'RUE').replace(/\b(AVENUE|AV|AVE)\b/g, 'AVENUE').replace(/\b(BOULEVARD|BD|BLD)\b/g, 'BOULEVARD')
       .replace(/\bST\b/g, 'SAINT').replace(/\bSTE\b/g, 'SAINTE');
  return s.replace(/[^A-Z0-9]+/g, ' ').trim();
}
function court(s, n) {
  s = String(s || '').replace(/\s+/g, ' ').replace(/(?:\+33\s?|0)[1-9](?:[ .-]?\d{2}){4}/g, '[tél.]').trim();
  return s.length > n ? s.slice(0, n) + '…' : s;
}
function fdist(m) { return m < 1000 ? Math.round(m) + ' m' : (m / 1000).toFixed(1).replace('.', ',') + ' km'; }

var _feries = {};
function feries(an, dept) {
  var am = dept === '57' || dept === '67' || dept === '68', cle = an + (am ? 'am' : '');
  if (_feries[cle]) return _feries[cle];
  var a = an % 19, b = Math.floor(an / 100), c = an % 100, d = Math.floor(b / 4), e = b % 4, g = Math.floor((8 * b + 13) / 25),
      h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7,
      m = Math.floor((a + 11 * h + 19 * l) / 433), mois = Math.floor((h + l - 7 * m + 90) / 25);
  var paques = new Date(an, mois - 1, (h + l - 7 * m + 33 * mois + 19) % 32), j = {};
  [[new Date(an, 0, 1), "Jour de l'an"], [plusJours(paques, 1), 'Lundi de Pâques'], [new Date(an, 4, 1), '1er mai'],
   [new Date(an, 4, 8), '8 mai'], [plusJours(paques, 39), 'Ascension'], [plusJours(paques, 50), 'Lundi de Pentecôte'],
   [new Date(an, 6, 14), '14 juillet'], [new Date(an, 7, 15), '15 août'], [new Date(an, 10, 1), 'Toussaint'],
   [new Date(an, 10, 11), '11 novembre'], [new Date(an, 11, 25), 'Noël']].forEach(function (x) { j[fd(x[0], false)] = x[1]; });
  if (am) { j[fd(plusJours(paques, -2), false)] = 'Vendredi saint'; j[fd(new Date(an, 11, 26), false)] = 'Saint-Étienne'; }
  return (_feries[cle] = j);
}
function ouvre(d, dept) { return d.getDay() >= 1 && d.getDay() <= 5 && !feries(d.getFullYear(), dept)[fd(d, false)]; }
function joursOuvres(depart, n, dept) {
  var d = new Date(depart.getTime());
  while (n > 0) { d = plusJours(d, 1); if (ouvre(d, dept)) n--; }
  return d;
}
function heuresOuvrees(depart, n, dept) {
  var d = new Date(depart.getTime()), reste = n * 3600e3, R = REGLAGES;
  for (;;) {
    if (!ouvre(d, dept) || d.getHours() >= R.HO_FIN) { d = plusJours(d, 1); d.setHours(R.HO_DEBUT, 0, 0, 0); continue; }
    if (d.getHours() < R.HO_DEBUT) d.setHours(R.HO_DEBUT, 0, 0, 0);
    var fin = new Date(d.getTime()); fin.setHours(R.HO_FIN, 0, 0, 0);
    if (d.getTime() + reste <= fin.getTime()) return new Date(d.getTime() + reste);
    reste -= fin - d;
    d = plusJours(d, 1); d.setHours(R.HO_DEBUT, 0, 0, 0);
  }
}
function distance(a, b) {
  if (!a.geo || !b.geo) return null;
  var r = Math.PI / 180, la1 = a.geo.lat * r, la2 = b.geo.lat * r, dla = la2 - la1, dlo = (b.geo.lon - a.geo.lon) * r;
  var h = Math.pow(Math.sin(dla / 2), 2) + Math.cos(la1) * Math.cos(la2) * Math.pow(Math.sin(dlo / 2), 2);
  return 6371000 * 2 * Math.asin(Math.sqrt(h));
}

function regleGtr(t) {
  var c = t.creee, R = REGLAGES, m;
  for (var i = 0; i < t.tags.length; i++) {
    m = /^(\d+)\s*H\s*HO$/.exec(t.tags[i]);
    if (m) return ['[' + t.tags[i] + '] : ' + (+m[1]) + ' h ouvrées', c && heuresOuvrees(c, +m[1], t.dept)];
  }
  m = /OTR\s*(\d+)\s*J\s*OUVR/i.exec(t.desc);
  if (m) return ['GTR écrite « OTR ' + m[1] + 'J » : ' + m[1] + ' j ouvrés', c && joursOuvres(c, +m[1], t.dept)];
  if (t.niveau === 2 && t.rdv) return ['Niveau 2 avec RDV client : selon le RDV', null];
  var g = R.GTR_NIVEAU[t.niveau];
  if (g) {
    if (g[0] === 'heures') return ['Niveau ' + t.niveau + ' : ' + g[1] + ' h', c && new Date(c.getTime() + g[1] * 3600e3)];
    return ['Niveau ' + t.niveau + (t.niveau === 2 ? ' hors RDV' : '') + ' : ' + g[1] + ' j ouvré' + (g[1] > 1 ? 's' : ''), c && joursOuvres(c, g[1], t.dept)];
  }
  return ['Sans niveau : échéance Praxedo', t.avant];
}

function datesNotes(texte, NOW) {
  var out = [], re = /(^|[^\d\/.])(\d{1,2})[\/.](\d{1,2})(?:[\/.](\d{4}|\d{2}))?(?![\d\/.])/g, m;
  texte = texte || '';
  while ((m = re.exec(texte))) {
    var an = m[4] ? (m[4].length === 2 ? 2000 + +m[4] : +m[4]) : NOW.getFullYear();
    var d = new Date(an, m[3] - 1, +m[2]);
    if (d.getMonth() !== m[3] - 1 || d.getDate() !== +m[2]) continue;
    if (!m[4] && d > plusJours(NOW, 120)) d.setFullYear(an - 1);
    var debut = m.index + m[1].length;
    out.push([d, RE_PREVU.test(texte.slice(Math.max(0, debut - 40), debut))]);
  }
  return out;
}

function suivi(t, NOW) {
  var texte = t.notes + ' ' + t.justif, qui = '', action, motifs = [
    [/enedis|erdf/i, 'Enedis'], [/orange|\bft\b|france\s*t[ée]l[ée]com/i, 'Orange'],
    [/mairie|arr[êe]t[ée]|voirie|commune/i, 'la mairie'], [/syndic/i, 'le syndic'],
    [/gestionnaire|bailleur/i, 'le bailleur'], [/client|\brdv\b/i, 'le client']];
  for (var i = 0; i < motifs.length; i++) if (motifs[i][0].test(texte)) { qui = motifs[i][1]; break; }
  if (!qui && /exploitant[^\n]{0,60}orange|poteau\s+orange|\bpot\.?\s*ft\b/i.test(t.desc)) qui = 'Orange';
  if (/nacelle/i.test(texte)) action = "Vérifier qu'une nacelle est disponible, puis planifier";
  else if (/[ée]lagage/i.test(texte)) action = "Vérifier si l'élagage est fait (relancer " + (qui || 'la mairie') + ')';
  else if (/mat[ée]riel/i.test(texte)) action = 'Vérifier si le matériel est arrivé, puis planifier';
  else if (['la mairie', 'le syndic', 'le bailleur', 'le client'].indexOf(qui) >= 0) action = 'Relancer ' + qui;
  else if (/poteau|\bpot\b|appui|\bsig\b|signalisation/i.test(texte)) action = 'Relancer ' + (qui || 'le propriétaire du poteau (Orange ou Enedis)') + ' et vérifier si le poteau est remplacé';
  else action = 'Vérifier si la cause du retard est levée' + (qui ? ', relancer ' + qui : '');
  var ds = datesNotes(t.notes, NOW), prevus = ds.filter(function (x) { return x[1]; }).map(function (x) { return x[0]; });
  if (prevus.length) {
    var d = new Date(Math.max.apply(null, prevus));
    if (d > NOW) return { qui: qui, action: 'Travaux annoncés le ' + fd(d, false) + ' : vérifier après cette date', base: 'travaux annoncés le ' + fd(d, false), prochaine: plusJours(d, 1), due: false };
    return { qui: qui, action: 'Vérifier si les travaux annoncés le ' + fd(d, false) + " sont faits, puis planifier l'intervention", base: 'travaux annoncés le ' + fd(d, false), prochaine: d, due: true };
  }
  var passees = ds.map(function (x) { return x[0]; }).filter(function (d) { return d <= NOW; });
  var base = passees.length ? new Date(Math.max.apply(null, passees)) : t.creee;
  if (!base) return { qui: qui, action: action, base: '', prochaine: null, due: true };
  var prochaine = joursOuvres(base, REGLAGES.RELANCE_JO, t.dept);
  return { qui: qui, action: action, base: (passees.length ? 'dernière date notée : ' : 'création du ticket : ') + fd(base, false), prochaine: prochaine, due: prochaine <= NOW };
}

/** donnees = { entetes, lignes, fins, adresses } (voir donnees() dans Code.gs). */
function analyser(donnees, NOW) {
  var R = REGLAGES, TODAY = new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate());
  var entetes = (donnees.entetes || []).indexOf('N°') >= 0 ? donnees.entetes : ['N°', 'Statut', 'Type inter.', 'Créée', 'Adresse', 'CP', 'Ville site', 'Description'];
  var col = {}; entetes.forEach(function (c, i) { col[c] = i; });
  var colsNotes = entetes.filter(function (c) { return RE_COL_NOTES.test(c) && c !== 'Description'; });
  var colFin = entetes.filter(function (c) { return RE_COL_FIN.test(c); })[0];
  // tickets créés par mail depuis le dernier import et pas encore dans l'export : ajoutés comme « Qualifiée » (à planifier).
  // Un import fait après le mail qui ne contient pas le ticket l'enlève (il est sorti du filtre).
  var lignes = (donnees.entetes || []).indexOf('N°') >= 0 ? (donnees.lignes || []).slice() : [], dansExport = {}, parMail = {};
  lignes.forEach(function (r) { var n = String(r[col['N°']] || '').trim(); dansExport[n] = 1; dansExport[n.split('#')[0]] = 1; });
  var importe = donnees.importeLe ? new Date(donnees.importeLe) : null;
  (donnees.creations || []).forEach(function (c) {
    var recu = dt(c.recu);
    if (!c.num || dansExport[c.num] || dansExport[c.num.split('#')[0]] || parMail[c.num] || !recu || (importe && recu <= importe)) return;
    parMail[c.num] = 1;
    var r = entetes.map(function () { return ''; }), mettre = function (k, v) { if (col[k] != null) r[col[k]] = v; };
    mettre('N°', c.num); mettre('Statut', 'Qualifiée'); mettre('Type inter.', c.type); mettre('Créée', c.recu);
    mettre('Adresse', c.adresse); mettre('CP', c.cp); mettre('Ville site', c.ville); mettre('Description', c.desc);
    lignes.push(r);
  });
  // fins d'intervention reçues par mail : la plus récente par n° de ticket (et par n° sans « #… »)
  // notes de l'onglet Notes, par n° de ticket (avec ou sans « #0 », majuscules ou non) ; plusieurs lignes s'ajoutent
  var notesTapees = {};
  (donnees.notes || []).forEach(function (n) {
    var k = String(n.num || '').trim().toUpperCase().split('#')[0], v = String(n.note || '').trim();
    if (k && v) (notesTapees[k] = notesTapees[k] || []).push(v);
  });
  var fins = {};
  (donnees.fins || []).forEach(function (f) {
    if (!f.num) return;
    [f.num, f.num.split('#')[0]].forEach(function (k) { if (!fins[k] || dt(f.recu) > dt(fins[k].recu)) fins[k] = f; });
  });
  var T = lignes.map(function (r) {
    var g = function (c) { return col[c] == null ? '' : String(r[col[c]] == null ? '' : r[col[c]]).trim(); };
    var num = g('N°');
    if (!num) return null;
    var desc = g('Description').replace(/\r\n|\n\r|\r/g, '\n'), tete = desc.slice(0, 250);
    var tags = []; tete.replace(/\[([^\]]+)\]/g, function (_, x) { tags.push(x.trim().toUpperCase()); });
    var niv = /niveau\s*(\d)/i.exec(tete);
    var noteTapee = (notesTapees[num.toUpperCase().split('#')[0]] || []).join(' · ');
    var notes = colsNotes.map(g).concat([noteTapee]).filter(function (x) { return x; }).join(' · ');
    var mj = RE_JUSTIF.exec(notes) || RE_JUSTIF.exec(desc);
    var cp = g('CP'), site = g('Site'), msite = /^(?:SRO|PMU|NRO)-(\d{2})/.exec(site);
    var adr = [g('Adresse'), cp, g('Ville site')].filter(function (x) { return x; }).join(' ');
    var t = {
      num: num, base: num.split('#')[0], statut: g('Statut'), planif: dt(g('Planifiée')),
      tech: [g('Nom technicien'), g('Prénom technicien')].filter(function (x) { return x; }).join(' '),
      site: site, equip: g('Equipement'), creee: dt(g('Créée')), avant: dt(g('À faire avant')),
      adresse: g('Adresse'), cp: cp, ville: g('Ville site'), desc: desc, tags: tags, niveau: niv ? +niv[1] : null,
      rdv: tags.indexOf('RDVCLI') >= 0, nacelle: /nacelle/i.test(desc), notes: notes, noteTapee: noteTapee,
      justif: mj ? (RE_JUSTIF.exec(notes) ? 'Note : « ' : 'Description : « ') + mj[0].replace(/\s+/g, ' ').trim().replace(/[\s,;:-]+$/, '') + ' »' : '',
      dept: cp ? cp.slice(0, 2) : (msite ? msite[1] : '54'),
      geo: donnees.adresses ? donnees.adresses[adr] || null : null, alertes: [],
      statutExport: g('Statut'), client: g('Client'), contact: g('Contact'),
      geoCherche: !!donnees.adresses && Object.prototype.hasOwnProperty.call(donnees.adresses, adr)
    };
    t.immeuble = RE_IMMEUBLE.test(t.contact) ? t.contact.toUpperCase() : '';
    t.cls = uniques(trouver(desc + ' ' + t.client, RE_CLS));
    t.pto = uniques(trouver(desc, RE_PTO));
    t.boites = uniques(trouver(desc + ' ' + t.equip, RE_BOITE).map(function (x) { return x.toUpperCase(); }));
    t.refs = uniques(trouver(desc, RE_REF, 1).map(function (x) { return 'BB-' + x.toUpperCase(); })).filter(function (x) { return x !== t.base.toUpperCase(); });
    var info = RE_INFO_SITE.exec(desc);
    t.infoSite = info ? info[1].toUpperCase() : '';
    t.iteration = /#(\d+)$/.test(num) ? +/#(\d+)$/.exec(num)[1] : 0;
    var fin = fins[num] || fins[t.base];
    t.fin = fin || null;
    t.annule = RE_STATUT_ANNULE.test(t.statut);
    t.finStatut = !t.annule && RE_STATUT_FIN.test(t.statut);
    // date de fin : mail, sinon colonne de fin de l'export, sinon date planifiée
    t.finLe = fin ? dt(fin.recu) : t.finStatut ? (colFin && dt(g(colFin))) || t.planif : null;
    t.termine = !!fin || t.finStatut;
    var ouvert = !t.termine && STATUTS_OUVERTS.indexOf(t.statut) >= 0;
    t.ouvert = ouvert;
    t.aPlanifier = !t.termine && (t.statut === 'Qualifiée' || t.statut === 'Pré-planifiée');
    t.deplanifie = t.statut === 'Qualifiée' && !!t.planif;
    if (parMail[num]) { t.parMail = true; t.statut = "Reçu par mail de création (pas encore dans l'export)"; }
    var rg = regleGtr(t); t.regle = rg[0]; t.echeance = rg[1] || null; t.echGtr = !/^Sans niveau/.test(t.regle);
    var e = t.echeance;
    if (ouvert && e && e < NOW && t.justif) t.alertes.push('Retard justifié (' + fretard(NOW - e) + ')');
    else if (ouvert && t.justif) t.alertes.push('Justifié / en attente');
    else if (ouvert && e && e < NOW) t.alertes.push('Échéance dépassée de ' + fretard(NOW - e));
    else if (t.aPlanifier && e && e < plusJours(NOW, 2)) t.alertes.push('Échéance dans moins de 48 h et pas planifié');
    if (t.deplanifie && !t.termine) t.alertes.push('Déplanifié : revenu en « Qualifiée »');
    if (ouvert && (t.statut === 'Planifiée' || t.statut === 'Synchronisée') && t.planif) {
      if (t.planif < TODAY) t.alertes.push('Date planifiée passée, pas de mail de fin');
      if (e && t.planif > e) t.alertes.push("Planifiée après l'échéance");
    }
    return t;
  }).filter(function (t) { return t; });

  var planifies = T.filter(function (t) { return !t.termine && (t.statut === 'Planifiée' || t.statut === 'Synchronisée') && t.planif && t.planif >= TODAY && t.geo; });
  T.forEach(function (t) {
    if (t.aPlanifier && t.geo) {
      var best = null;
      planifies.forEach(function (p) { var d = distance(t, p); if (d != null && d <= R.CASER_M && (!best || d < best[0])) best = [d, p]; });
      if (best) t.caser = { lat: best[1].geo.lat, lon: best[1].geo.lon, n: best[1].num, p: fd(best[1].planif), tech: best[1].tech || 'sans technicien', d: fdist(best[0]) };
    }
    t.nouveau = t.aPlanifier && !t.justif && !!t.creee && NOW - t.creee < R.NOUVEAU_H * 3600e3;
    if (t.aPlanifier && t.justif) { t.suivi = suivi(t, NOW); if (t.suivi.due) t.alertes.push('À relancer / à vérifier'); }
    var a = t.alertes;
    t.prio = t.justif ? 4 : a.some(function (x) { return /^Échéance (dépassée|dans moins)/.test(x); }) ? 1
           : (t.niveau === 2 || t.niveau === 3) && (t.equip === 'Service Interrompu' || t.equip === 'Service Dégradé') || t.deplanifie || t.niveau === 3 ? 2 : 3;
    t.categorie = t.annule ? 'annule' : t.termine ? 'termine' : t.aPlanifier ? (t.justif ? 'justifie' : t.nouveau ? 'nouveau' : t.prio === 1 ? 'retard' : 'aplanifier') : 'planifie';
  });

  var nums = {}; T.forEach(function (t) { nums[t.num] = 1; nums[t.base] = 1; });
  // tickets sortis du filtre depuis l'import précédent : terminés ou annulés, en vert le jour même
  var vus = {};
  (donnees.sortis || []).slice().reverse().forEach(function (s) {
    var le = dt(s.le);
    if (!s.num || nums[s.num] || vus[s.num] || !le || le < TODAY) return;
    vus[s.num] = 1;
    var adr = [s.adresse, s.cp, s.ville].filter(function (x) { return x; }).join(' ');
    T.push({ num: s.num, base: s.num.split('#')[0], statut: s.statut, planif: dt(s.planif), tech: s.tech, site: s.site, adresse: s.adresse,
             cp: s.cp, ville: s.ville, desc: '', creee: null, regle: '', echeance: null, alertes: [], tags: [], justif: '',
             geo: donnees.adresses ? donnees.adresses[adr] || null : null, fin: null, sorti: le, finLe: le, termine: true, categorie: 'termine' });
  });
  // un ticket terminé reste en vert le jour de sa fin, puis disparaît de la carte le lendemain
  var visibles = T.filter(function (t) { return !t.termine || (t.finLe && t.finLe >= TODAY); });
  return {
    tous: T,
    tickets: visibles,
    nouveaux: T.filter(function (t) { return t.categorie === 'nouveau'; }).sort(function (a, b) { return (!!b.caser - !!a.caser) || (b.creee - a.creee); }),
    relances: T.filter(function (t) { return t.categorie === 'justifie' && t.suivi && t.suivi.due; }),
    terminesAujourdhui: T.filter(function (t) { return t.termine && t.finLe && t.finLe >= TODAY; }),
    finsHorsExport: (donnees.fins || []).filter(function (f) { return f.num && !nums[f.num] && !nums[f.num.split('#')[0]]; })
  };
}

/**
 * Les trois listes de contrôle de l'Excel (onglets du Google Sheet) : incohérences, tickets liés, PM chargés.
 * res = analyser(donnees, NOW). Les tickets terminés ou annulés sont laissés de côté.
 */
function controles(res, NOW) {
  var TODAY = new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate());
  var T = res.tous.filter(function (t) { return !t.termine && !t.annule && !t.sorti; });
  var INC = [];
  function inc(g, t, probleme, detail) { INC.push([g, t, probleme, detail || '']); }
  T.forEach(function (t) {
    var e = t.echeance, st = t.statutExport;
    if (t.ouvert && e && e < NOW && t.justif) inc('4 - Info', t, 'Retard justifié (' + fretard(NOW - e) + ')', t.justif + ' · échéance GTR ' + fd(e));
    else if (t.ouvert && t.justif) { /* justifié, pas encore en retard */ }
    else if (t.ouvert && e && e < NOW) inc(st === 'Qualifiée' ? '1 - Urgent' : '2 - Important', t, 'Échéance dépassée de ' + fretard(NOW - e),
      t.regle + ' · à faire avant le ' + fd(e) + ' · statut ' + st + (t.planif && !t.deplanifie ? ' · planifiée le ' + fd(t.planif) : ''));
    else if (t.aPlanifier && e && e < plusJours(NOW, 2)) inc('1 - Urgent', t, 'Échéance dans moins de 48 h et pas planifié', t.regle + ' · à faire avant le ' + fd(e));
    if (t.echGtr && e && t.avant && Math.abs(t.avant - e) > 2 * 86400e3) inc('3 - À vérifier', t, 'Échéance Praxedo différente de la GTR', t.regle + ' → ' + fd(e) + ' · Praxedo : ' + fd(t.avant));
    if (t.ouvert && !e && !t.rdv) inc('3 - À vérifier', t, "Pas d'échéance (ni niveau, ni « À faire avant »)");
    if (t.deplanifie) inc('2 - Important', t, 'Déplanifié : revenu en « Qualifiée »',
      'Était planifié le ' + fd(t.planif) + ", n'a plus de technicien" + (e && t.planif > e ? ' · déjà en retard à cette date' : ''));
    if ((st === 'Planifiée' || st === 'Synchronisée') && t.planif) {
      if (t.planif < TODAY) inc('2 - Important', t, 'Date planifiée passée, intervention pas clôturée', 'Prévue le ' + fd(t.planif) + ' (' + t.tech + '), toujours « ' + st + ' »');
      if (e && t.planif > e) inc('2 - Important', t, "Planifiée après l'échéance", 'Prévue le ' + fd(t.planif) + ', à faire avant le ' + fd(e) + ' (' + t.regle + ')');
    }
    if (st === 'Pré-planifiée' && t.planif && e && t.planif > e) inc('2 - Important', t, "Pré-planifiée après l'échéance", 'Prévue le ' + fd(t.planif) + ', à faire avant le ' + fd(e) + ' (' + t.regle + ')');
    if (t.planif && !t.deplanifie) {
      var jf = feries(t.planif.getFullYear(), t.dept)[fd(t.planif, false)];
      if (jf) inc('3 - À vérifier', t, 'Planifiée un jour férié (' + jf + ')', fd(t.planif) + ' · ' + t.tech);
      else if (t.planif.getDay() === 0 || t.planif.getDay() === 6) inc('3 - À vérifier', t, 'Planifiée un week-end', fd(t.planif) + ' · ' + t.tech);
    }
    if (['Planifiée', 'Synchronisée', 'Pré-planifiée'].indexOf(st) >= 0 && !t.tech) inc('2 - Important', t, 'Planifiée sans technicien');
    if (t.aPlanifier && t.creee && Math.floor((NOW - t.creee) / 86400e3) > 60) inc('2 - Important', t, 'Vieux ticket : créé il y a ' + Math.floor((NOW - t.creee) / 86400e3) + ' j', 'Créé le ' + fd(t.creee, false));
    if (!t.cp) inc('3 - À vérifier', t, 'Code postal vide', /\b\d{5}\b/.test(t.adresse) ? 'Le code postal est écrit dans la colonne Adresse' : '');
    var g = t.geo;
    if (!g && t.geoCherche && (t.adresse || t.ville)) inc('3 - À vérifier', t, 'Adresse introuvable', t.adresse + ' ' + t.cp + ' ' + t.ville);
    else if (g) {
      var nc = norm(g.city), nv = norm(t.ville);
      if (nc !== nv && nc.indexOf(nv) < 0 && nv.indexOf(nc) < 0) inc('3 - À vérifier', t, 'Adresse trouvée dans une autre commune', 'Praxedo : ' + t.adresse + ' ' + t.cp + ' ' + t.ville + ' · trouvée : ' + g.label);
      else if (t.cp && g.postcode && String(g.postcode) !== t.cp) inc('3 - À vérifier', t, 'Code postal qui ne correspond pas à la ville', 'Praxedo : ' + t.cp + ' ' + t.ville + ' · officiel : ' + g.postcode);
      else if ((g.score || 0) < 0.5 || g.type === 'municipality') inc('3 - À vérifier', t, 'Adresse imprécise (placée au centre de la commune)', t.adresse + ' ' + t.cp + ' ' + t.ville);
    }
    if (/L'incident concerne\s*:\s*undefined|Localisation la plus proche communiquée\s*:\s*0\b/i.test(t.desc))
      inc('3 - À vérifier', t, 'Localisation vague dans la description', "« undefined » ou numéro « 0 » : repérer le lieu exact avant d'envoyer quelqu'un");
    if (t.infoSite && t.immeuble && t.infoSite !== t.immeuble && t.infoSite !== t.site.toUpperCase())
      inc('3 - À vérifier', t, 'Site de la description ≠ champ Contact', 'Description : ' + t.infoSite + ' · Contact : ' + t.immeuble);
    if (t.client && /^[A-Z]{2}\d{3}-[A-Z]{5}-\d{3}$/.test(t.client)) inc('4 - Info', t, 'Champ Client rempli avec la référence client au lieu de la commune', t.client);
    if (t.iteration >= 2) inc('4 - Info', t, 'Ticket rouvert ' + t.iteration + ' fois (#' + t.iteration + ')');
  });
  // même technicien : même créneau, ou deux interventions trop loin l'une de l'autre pour l'écart de temps
  var parTech = {};
  T.forEach(function (t) { if (t.tech && t.planif && !t.deplanifie) (parTech[t.tech] = parTech[t.tech] || []).push(t); });
  Object.keys(parTech).forEach(function (tech) {
    var L = parTech[tech].sort(function (a, b) { return a.planif - b.planif; });
    for (var i = 1; i < L.length; i++) {
      var a = L[i - 1], b = L[i], ecart = (b.planif - a.planif) / 60000;
      if (ecart === 0) inc('2 - Important', b, 'Même technicien, même créneau', tech + ' : ' + a.num + ' et ' + b.num + ' le ' + fd(a.planif));
      else {
        var d = distance(a, b);
        if (d && fd(a.planif, false) === fd(b.planif, false) && ecart <= 60 && d > 20000)
          inc('3 - À vérifier', b, 'Trajet serré entre deux interventions', tech + ' : ' + a.num + ' (' + a.ville + ') à ' + fd(a.planif).slice(11) + ' puis ' + b.num + ' (' + b.ville + ') à ' + fd(b.planif).slice(11) + ', ' + fdist(d) + " à vol d'oiseau");
      }
    }
  });

  // tickets liés : même immeuble, adresse, référence client, PTO, boîte, « suite de », ou au même endroit
  var parent = {}, liens = {};
  T.forEach(function (t) { parent[t.num] = t.num; });
  function racine(x) { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; }
  function lier(a, b, raison) {
    if (a === b) return;
    var k = [a.num, b.num].sort().join('|');
    (liens[k] = liens[k] || {})[raison] = 1;
    parent[racine(a.num)] = racine(b.num);
  }
  [[function (t) { return t.immeuble ? [t.immeuble] : []; }, 'même immeuble'],
   [function (t) { return /^\s*[1-9]/.test(t.adresse) ? [norm(t.adresse) + '|' + norm(t.ville)] : []; }, 'même adresse'],
   [function (t) { return t.cls; }, 'même référence client'], [function (t) { return t.pto; }, 'même PTO'],
   [function (t) { return t.boites; }, 'même boîte']].forEach(function (x) {
    var idx = {};
    T.forEach(function (t) { x[0](t).forEach(function (k) { (idx[k] = idx[k] || []).push(t); }); });
    Object.keys(idx).forEach(function (k) { for (var i = 1; i < idx[k].length; i++) lier(idx[k][0], idx[k][i], x[1]); });
  });
  var parBase = {}; T.forEach(function (t) { parBase[t.base.toUpperCase()] = t; });
  T.forEach(function (t) { t.refs.forEach(function (r) { if (parBase[r]) lier(t, parBase[r], 'suite de ' + r); }); });
  T.forEach(function (t) {
    T.forEach(function (u) {
      if (t.num < u.num && (t.aPlanifier || u.aPlanifier)) {
        var d = distance(t, u);
        if (d != null && d < 30 && (t.immeuble !== u.immeuble || !t.immeuble)) lier(t, u, 'même endroit (< 30 m)');
      }
    });
  });
  var groupes = {}, ordre = [];
  T.forEach(function (t) { var r = racine(t.num); if (!groupes[r]) { groupes[r] = []; ordre.push(r); } groupes[r].push(t); });
  var G = ordre.map(function (r) { return groupes[r]; })
    .filter(function (g) { return g.length > 1 && g.some(function (x) { return x.aPlanifier; }); })
    .sort(function (a, b) {
      var na = a.filter(function (x) { return x.aPlanifier; }).length, nb = b.filter(function (x) { return x.aPlanifier; }).length;
      var ca = Math.min.apply(null, a.map(function (x) { return x.creee ? +x.creee : +NOW; })), cb = Math.min.apply(null, b.map(function (x) { return x.creee ? +x.creee : +NOW; }));
      return (nb - na) || (ca - cb);
    });
  var lies = [];
  G.forEach(function (g, i) {
    var raisons = {};
    g.forEach(function (a) { g.forEach(function (b) { var l = liens[a.num + '|' + b.num]; if (l) Object.keys(l).forEach(function (r) { raisons[r] = 1; }); }); });
    var texte = Object.keys(raisons).sort().join(', ');
    g.slice().sort(function (a, b) { return (a.creee ? +a.creee : +NOW) - (b.creee ? +b.creee : +NOW); }).forEach(function (t) {
      lies.push(['G' + (i + 1), texte, t.num, t.statutExport, fd(t.planif), t.tech, fd(t.creee), t.ville, t.adresse, t.immeuble,
                 t.boites.join(', '), t.cls.join(', '), court(t.desc, 200)]);
    });
    g.forEach(function (t) {
      if (!t.aPlanifier) return;
      var deja = g.filter(function (x) { return x !== t && (x.statutExport === 'Planifiée' || x.statutExport === 'Synchronisée') && x.planif; });
      if (deja.length) inc('2 - Important', t, 'Lié à une intervention déjà planifiée', texte + ' : ' + deja[0].num + ' prévue le ' + fd(deja[0].planif) + ' avec ' + deja[0].tech);
      else if (g.some(function (x) { return x !== t && x.aPlanifier; }) && (raisons['même référence client'] || raisons['même PTO']))
        inc('2 - Important', t, 'Doublon probable', texte + ' avec ' + g.filter(function (x) { return x !== t; }).map(function (x) { return x.num; }).sort().join(', '));
    });
  });

  // PM avec au moins 3 tickets ouverts
  var PM = {}, ordrePm = [];
  T.forEach(function (t) {
    if (STATUTS_OUVERTS.indexOf(t.statutExport) < 0 || !t.site) return;
    var k = t.site.toUpperCase();
    if (!PM[k]) { PM[k] = []; ordrePm.push(k); }
    PM[k].push(t);
  });
  var pm = ordrePm.filter(function (k) { return PM[k].length >= 3; }).sort(function (a, b) { return PM[b].length - PM[a].length; }).map(function (k) {
    var v = PM[k], c = v.filter(function (x) { return x.creee; }).map(function (x) { return +x.creee; });
    return [k, v.length, v.filter(function (x) { return x.aPlanifier; }).length, uniques(v.map(function (x) { return x.ville; })).join(', '),
            c.length ? fd(new Date(Math.min.apply(null, c)), false) + ' → ' + fd(new Date(Math.max.apply(null, c)), false) : '',
            uniques(v.map(function (x) { return x.equip; }).filter(function (x) { return x; })).join(', '),
            v.slice().sort(function (a, b) { return (a.creee ? +a.creee : +NOW) - (b.creee ? +b.creee : +NOW); }).map(function (x) { return x.num; }).join(', ')];
  });

  INC.sort(function (a, b) { return a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : a[1].num < b[1].num ? -1 : a[1].num > b[1].num ? 1 : 0; });
  return {
    incoherences: INC.map(function (i) { return [i[0], i[1].num, i[1].statutExport, i[2], i[3], i[1].tech, i[1].ville, i[1].adresse]; }),
    lies: lies, pm: pm
  };
}
</script>
