# ================================================================
#  Coco RP - configuration du serveur FiveM
#  Les lignes qui commencent par # sont des commentaires (ignorées).
#  La clé de licence et les admins sont dans secrets.cfg.
# ================================================================

## ---- Réseau ---------------------------------------------------
# Port du serveur : à ouvrir sur ta box en TCP *et* UDP
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

## ---- Ce qu'on voit dans la liste des serveurs ------------------
# Les ^chiffres changent la couleur (^5 bleu, ^7 blanc, ^9 rose...)
sv_hostname "^5Coco ^7RP ^9| Serveur français freeroam & RP"
sets sv_projectName "Coco RP"
sets sv_projectDesc "Serveur français : freeroam et roleplay détendu"
sets locale "fr-FR"
sets tags "français, roleplay, freeroam"

# Logo du serveur : image PNG de 96 x 96 pixels posée à côté de ce fichier
#load_server_icon logo.png
#sets banner_detail "https://exemple.fr/banniere.png"
#sets Discord "https://discord.gg/ton-lien"

# Nombre de places (48 maximum avec une clé gratuite)
sv_maxclients 32

# Décommenter pour cacher le serveur de la liste publique (connexion par IP seulement)
#sv_master1 ""

## ---- Sécurité ---------------------------------------------------
sv_scriptHookAllowed 0
sv_endpointprivacy true

## ---- Ressources de base (installées par l'installeur) -----------
ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager
ensure basic-gamemode
ensure hardcap

## ---- Ressources Coco (dossier resources/[coco]) ------------------
ensure coco_base
ensure coco_commandes
ensure coco_admin

## ---- Permissions -------------------------------------------------
# Le groupe admin a accès à toutes les commandes (sauf éteindre le serveur)
add_ace group.admin command allow
add_ace group.admin command.quit deny
# Les admins eux-mêmes sont déclarés dans secrets.cfg

## ---- Clé de licence, admins et réglages privés --------------------
exec secrets.cfg
